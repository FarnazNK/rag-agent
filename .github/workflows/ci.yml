name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql://postgres@localhost:5432/rag_agent
      APP_JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,tracing]"

      - name: Lint
        run: ruff check src tests scripts benchmarks

      - name: Format check
        run: ruff format --check src tests scripts benchmarks

      - name: Type check
        run: mypy src

      - name: Unit + integration tests
        run: pytest -ra

      - name: Eval regression gate
        run: |
          python scripts/run_evals.py \
            --dataset data/eval_datasets/hr_full.yaml \
            --no-judge \
            --fail-under 0.7 \
            --min-retrieval-recall 0.7 \
            --min-groundedness 0.6 \
            --max-p95-latency-s 5.0 \
            --out benchmarks/results/ci_eval.json

      - name: Benchmark gate
        run: |
          python benchmarks/load/run_load.py --quick --out benchmarks/load/results/report.md
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmarks/load/results/report.json").read_text())
          p95 = max(s["p95_ms"] for s in data["scenarios"])
          if p95 > 300:
              raise SystemExit(f"p95 {p95}ms exceeds threshold 300ms")
          PY

      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-type-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-agent:ci
