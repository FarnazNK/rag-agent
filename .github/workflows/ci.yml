name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_agent
          POSTGRES_DB: rag_agent
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_agent -d rag_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_URL: postgresql+psycopg://rag_agent@localhost:5432/rag_agent
      TEST_DATABASE_URL: postgresql+psycopg://rag_agent@localhost:5432/rag_agent
      APP_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      APP_LLM_PROVIDER: deterministic
      APP_EMBEDDING_PROVIDER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,tracing]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Type check
        run: mypy src
      - name: Migrate database
        run: alembic upgrade head
      - name: Unit tests
        run: pytest -q -m 'not integration'
      - name: Integration tests
        run: pytest -q -m integration
      - name: Evaluation gates
        run: python scripts/run_evals.py --dataset data/eval_datasets/quality.yaml --out benchmarks/results/eval_report.json
      - name: Benchmark regression gate
        run: python benchmarks/load/run_benchmark.py --assert-p95-ms 500 --out benchmarks/load/results/ci-benchmark.json
      - name: Dependency scan
        run: pip-audit
      - name: Docker build
        run: docker build -t rag-agent:ci .
