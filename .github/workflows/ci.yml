name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,tracing]"

      - name: Ruff (lint)
        run: ruff check src tests scripts benchmarks

      - name: Ruff (format check)
        run: ruff format --check src tests scripts benchmarks

      - name: Mypy
        run: mypy src
        continue-on-error: true   # mypy is informational until we tighten types

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,tracing]"

      - name: Run unit tests with coverage
        # Tests don't need API keys — LLM and embedding clients are mocked at
        # the module boundary.
        run: |
          pytest --cov=rag_agent --cov-report=xml --cov-report=term -ra

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-agent:ci
          # Build cache via gha so subsequent runs are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        # Just confirm uvicorn imports the app without crashing. We don't run
        # /query here — that needs API keys we don't put in CI.
        run: |
          docker run --rm rag-agent:ci python -c "from rag_agent.api import create_app; app = create_app(); print('app ok:', app.title)"
