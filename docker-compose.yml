services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_agent
      POSTGRES_DB: rag_agent
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag_agent -d rag_agent']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DATABASE_URL: postgresql+psycopg://rag_agent@postgres:5432/rag_agent
      APP_JWT_SECRET: local-development-secret-local-development-secret
      APP_ENABLE_BOOTSTRAP_ADMIN: 'true'
      APP_LLM_PROVIDER: deterministic
      APP_EMBEDDING_PROVIDER: deterministic
      APP_LOG_LEVEL: INFO
    ports:
      - '8000:8000'

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus

volumes:
  postgres-data:
