name: review
description: Review repository code without modifying it.
instructions: |
  Inspect the relevant implementation, tests, and configuration.
  Focus on correctness, security, reliability, maintainability, and missing verification.
  Cite file paths in the final summary and prioritize findings by impact.
  Do not modify files.
allowed_tools:
  - list_files
  - read_file
  - search_code
  - run_check
