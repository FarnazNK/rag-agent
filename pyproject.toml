[project]
name = "rag-agent"
version = "1.1.0"
description = "Production-oriented RAG API and policy-controlled developer-agent harness with evaluation and observability."
requires-python = ">=3.11"
authors = [{ name = "Farnaz Nasehi" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyJWT>=2.12.0",
    "SQLAlchemy>=2.0.36",
    "psycopg>=3.2.3",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "python-multipart>=0.0.30",
    "pypdf>=6.14.2",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.10",
    "typer>=0.13",
    "rich>=13.9",
    "pyyaml>=6.0",
    "mangum>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "pip-audit>=2.7.3",
]
tracing = ["langsmith>=0.1.140"]

[project.scripts]
rag-agent = "rag_agent.cli:app"

[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL/pgvector",
]

[tool.mypy]
python_version = "3.11"
packages = ["rag_agent"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
ignore_missing_imports = true
